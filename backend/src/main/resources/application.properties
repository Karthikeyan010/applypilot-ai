spring.application.name=applypilot-backend

server.port=8080

# --- PostgreSQL DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/applypilot_db}
spring.datasource.username=${DB_USERNAME:applypilot_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- File upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Local/self-hosted inference only. No API key; never send CVs to a paid provider.
app.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ollama.model=${OLLAMA_MODEL:qwen3:4b}
app.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
app.ollama.max-source-characters=${OLLAMA_MAX_SOURCE_CHARACTERS:16000}
app.ollama.context-tokens=${OLLAMA_CONTEXT_TOKENS:16384}
