spring.application.name=applypilot-backend

server.port=8080

# H2 Database - temporary local development database
spring.datasource.url=jdbc:h2:file:./data/applypilot_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
app.jwt.secret=change-this-secret-key-to-a-long-random-secure-value-change-this
app.jwt.expiration=86400000