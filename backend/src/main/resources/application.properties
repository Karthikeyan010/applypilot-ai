spring.application.name=applypilot-backend

server.port=8080

# --- PostgreSQL DataSource ---
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/applypilot_db
spring.datasource.username=applypilot_user
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- File upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
app.jwt.secret=change-this-secret-key-to-a-long-random-secure-value-change-this
app.jwt.expiration=86400000