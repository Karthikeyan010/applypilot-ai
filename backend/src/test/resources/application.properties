# Test-only configuration: no production database or credentials are required.
spring.datasource.url=jdbc:h2:mem:backend-tests;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=backend-test-secret-at-least-32-characters-long
app.jwt.expiration=86400000
app.ollama.base-url=http://127.0.0.1:1
app.ollama.model=test-model
app.ollama.timeout-seconds=1
app.ollama.max-source-characters=16000
app.ollama.context-tokens=16384
